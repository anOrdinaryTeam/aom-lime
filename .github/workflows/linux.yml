name: Linux CI
on:
  workflow_dispatch:
  workflow_call:

env:
  HAXE_VERSION: 4.3.7

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-22 lld-22 gcc-12-i686-linux-gnu g++-12-i686-linux-gnu libstdc++-12-dev-i386-cross libdrm-dev:i386 libgl1-mesa-dev:i386 libglu1-mesa-dev:i386 libpulse-dev:i386 libasound2-dev:i386 libx11-dev:i386 libxext-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxinerama-dev:i386 libpng-dev:i386 libturbojpeg-dev:i386 libuv1-dev:i386 libvorbis-dev:i386 libdbus-1-dev:i386 libpipewire-0.3-dev:i386 libxcursor-dev:i386 libxss-dev:i386 libudev-dev:i386 libwayland-dev:i386 libxkbcommon-dev:i386 libegl1-mesa-dev:i386 libgles2-mesa-dev:i386 gcc-12 g++-12 libdrm-dev libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev libdbus-1-dev libpipewire-0.3-dev libxcursor-dev libxss-dev libudev-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev libjack-dev --no-install-recommends --no-install-suggests
      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/ShadowEngineTeam/hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
      - name: Enable HXCPP compile cache
        run: echo "HXCPP_COMPILE_CACHE=~/.hxcpp" >> $GITHUB_ENV
      - name: Configure Lime
        run: haxelib dev lime ${{ github.workspace }}
      - name: Rebuild Lime
        run: |
          CC="clang-22 --target=i686-linux-gnu" CXX="clang++-22 --target=i686-linux-gnu" LDFLAGS="-fuse-ld=lld" linux32 haxelib run lime rebuild linux -32 -release -nocolor -nocffi -D HXCPP_M32
          CC=clang-22 CXX=clang++-22 haxelib run lime rebuild linux -64 -release -nocolor -nocffi -D HXCPP_M64
      - name: Upload Artifact (x86)
        uses: actions/upload-artifact@main
        with:
          name: Linux-NDLL
          path: |
            ndll/Linux/
            !**/.gitignore
            lime.png
          if-no-files-found: error
      - name: Upload Artifact (x86_64)
        uses: actions/upload-artifact@main
        with:
          name: Linux64-NDLL
          path: |
            ndll/Linux64/
            !**/.gitignore
            lime.png
          if-no-files-found: error

